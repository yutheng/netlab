# topology.yaml â€” a small network described as data.
# build_topo.py reads this file and creates exactly this network in Mininet.
#
# Make it yours first (see "Your addresses" in the lab):
#   NNNN = the last 4 digits of your student ID, e.g. 4207
#   NN   = the last 2 digits, without a leading zero, e.g. 7
# Replace every NNNN and NN below. Don't put your full student ID here: this file
# goes in your repository, which may be public.

student_id_last4: "5015"

switches:
  - s1
  - s2
  - s3

hosts:
  - name: h1
    ip: 10.15.0.1/24
    ipv6: fd00:5015::1/64
  - name: h2
    ip: 10.15.0.2/24
    ipv6: fd00:5015::2/64
  - name: h3
    ip: 10.15.0.3/24
    ipv6: fd00:5015::3/64
  - name: h4
    ip: 10.15.0.4/24
    ipv6: fd00:5015::4/64
  - name: h5
    ip: 10.15.0.5/24
    ipv6: fd00:5015::5/64
  - name: h6
    ip: 10.15.0.1/24
    ipv6: fd00:5015::1/64

# Each link joins two nodes.
links:
  - [h1, s1]
  - [h2, s2]
  - [h3, s3]
  - [h4, s1]
  - [h5, s2]
  - [h6, s3]
  - [s1, s2]
  - [s2, s3]
  - [s10,s3]
